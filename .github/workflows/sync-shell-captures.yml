name: Sync shell captures

# Keeps this site's product imagery and palette true to the app. Upstream's
# `bin/capture-shell` re-photographs the real shell whenever the design moves,
# and its own `shell-capture` workflow refuses to merge a stale capture — so
# tracking the latest release tag here is enough to stay current.
#
# The refresh lands as a PR rather than a push, so a redesign is reviewed and
# deployed deliberately. The site can therefore lag a redesign by at most one
# schedule interval; making it push-driven needs a repository_dispatch from the
# app repo, which is tracked separately.

on:
  schedule:
    # 07:00 UTC daily.
    - cron: '0 7 * * *'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Upstream ref to sync from (default: latest release tag)'
        required: false
        type: string
  pull_request:
    paths:
      - 'src/**'
      - 'public/shell/**'
      - 'scripts/sync-from-upstream.mjs'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-shell-captures-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Refresh the synced files and open a PR when upstream has moved.
  sync:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc

      - run: npm ci

      - name: Sync captures and tokens from deskhq/the-desk
        id: sync
        env:
          # Raises the anonymous rate limit on the release lookup; the raw
          # downloads need no auth because the app repo is public.
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run sync:upstream ${{ inputs.ref && format('-- --ref {0}', inputs.ref) || '' }}

      - name: Build the site with the synced assets
        if: steps.sync.outputs.changed == 'true'
        run: npm run build

      - name: Open a pull request
        if: steps.sync.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          branch: sync/shell-captures
          base: master
          commit-message: 'chore: sync shell captures and tokens from the-desk ${{ steps.sync.outputs.tag }}'
          title: 'chore: sync product imagery from the-desk ${{ steps.sync.outputs.tag }}'
          body: |
            Automated refresh of the product imagery and design tokens from
            [`deskhq/the-desk@${{ steps.sync.outputs.tag }}`](https://github.com/deskhq/the-desk/releases/tag/${{ steps.sync.outputs.tag }}).

            Regenerated by `npm run sync:upstream`:

            - `public/shell/{desktop,mobile}-{light,dark}.png` — captured upstream by `bin/capture-shell`
            - `src/styles/tokens.css` — the app's `:root` and `.dark` token blocks

            ${{ steps.sync.outputs.drift }}

            Check the hero and the showcase section render correctly at mobile and
            desktop widths before merging.
          labels: automated, design-sync
          delete-branch: true

  # On a PR, fail if the synced files are stale or a hard-coded hex has drifted
  # away from the upstream token it copies.
  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
      - env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run sync:upstream:check
